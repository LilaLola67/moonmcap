name: check-build-test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      large_source:
        description: Verify actual million-message and over-2-GiB source files
        required: false
        default: false
        type: boolean
      public_corpus:
        description: Download and verify fingerprint-pinned public recordings
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, js]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: python tools/count_source.py
      - run: python tools/runtime_audit.py
      - run: moon check --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon run cmd/main --target ${{ matrix.target }}
      - run: moon run cmd/cursor --target ${{ matrix.target }}
      - name: Install official interoperability reference
        if: matrix.target == 'js'
        run: python -m pip install mcap==1.3.0 lz4==4.4.5 zstandard==0.25.0 protobuf==6.33.0 rosbags==0.11.0
      - name: Verify official MCAP interoperability
        if: matrix.target == 'js'
        run: python tools/interop.py
      - name: Verify compressed container workflows
        if: matrix.target == 'js'
        run: python tools/conformance.py
      - name: Verify adversarial corpus distributions
        if: matrix.target == 'js'
        run: python tools/corpus_workflows.py
      - name: Verify checked-in file examples
        if: matrix.target == 'js'
        run: python examples/run.py
      - name: Verify selective IO and cache benchmark
        if: matrix.target == 'js'
        run: python tools/range_benchmark.py
      - name: Verify streaming sink interoperability
        if: matrix.target == 'js'
        run: python tools/stream_workflows.py
      - name: Verify configurable CLI and atomic output
        if: matrix.target == 'js'
        run: python tools/cli_workflows.py
      - name: Verify batch transformations
        if: matrix.target == 'js'
        run: python tools/batch_workflows.py
      - name: Verify diagnostics and index rebuilding
        if: matrix.target == 'js'
        run: python tools/repair_workflows.py
      - name: Verify asynchronous IO and recording rotation
        if: matrix.target == 'js'
        run: python tools/async_workflows.py
      - name: Verify HTTP ranges retries and cancellation
        if: matrix.target == 'js'
        run: python tools/http_workflows.py
      - name: Verify bounded external disk sorting
        if: matrix.target == 'js'
        run: python tools/external_workflows.py
      - name: Verify independent block recovery manifests
        if: matrix.target == 'js'
        run: python tools/block_workflows.py
      - name: Verify disk-backed streaming transformations
        if: matrix.target == 'js'
        run: python tools/transform_stream_workflows.py
      - name: Verify cross-file dataset queries
        if: matrix.target == 'js'
        run: python tools/dataset_workflows.py
      - name: Verify persistent sidecar indexes and source fingerprints
        if: matrix.target == 'js'
        run: python tools/sidecar_workflows.py
      - name: Verify paged disk indexes
        if: matrix.target == 'js'
        run: python tools/disk_index_workflows.py
      - name: Measure scaled disk index build and query
        if: matrix.target == 'js'
        run: python tools/disk_index_scale.py
      - name: Verify input stage checkpoint recovery
        if: matrix.target == 'js'
        run: python tools/input_checkpoint_workflows.py
      - name: Verify Chunk stage and final sort crash recovery
        if: matrix.target == 'js'
        run: python tools/chunk_checkpoint_workflows.py
      - name: Verify unified async datasets
        if: matrix.target == 'js'
        run: python tools/async_dataset_workflows.py
      - name: Verify timed replay
        if: matrix.target == 'js'
        run: python tools/replay_workflows.py
      - name: Verify semantic log comparison
        if: matrix.target == 'js'
        run: python tools/diff_workflows.py
      - name: Verify bounded exact aggregation
        if: matrix.target == 'js'
        run: python tools/aggregate_workflows.py
      - name: Verify exact external group aggregation
        if: matrix.target == 'js'
        run: python tools/aggregate_external_workflows.py
      - name: Verify descriptor payload decoding against official protobuf
        if: matrix.target == 'js'
        run: python tools/protobuf_workflows.py
      - name: Verify canonical ProtoJSON and well known types
        if: matrix.target == 'js'
        run: python tools/protojson_workflows.py
      - name: Verify ROS2 XCDR1 alignment types and decoding queries
        if: matrix.target == 'js'
        run: python tools/cdr_workflows.py
      - name: Verify async paged local and cached remote indexes
        if: matrix.target == 'js'
        run: python tools/async_paged_workflows.py
      - name: Verify conservative field zone pruning and exact predicates
        if: matrix.target == 'js'
        run: python tools/field_index_workflows.py
      - name: Verify unified async query combinations and remote caches
        if: matrix.target == 'js'
        run: python tools/pipeline_workflows.py
      - name: Verify page bounded field indexes and large region counts
        if: matrix.target == 'js'
        run: python tools/paged_field_workflows.py
      - name: Verify selective payloads and binary array windows
        if: matrix.target == 'js'
        run: python tools/payload_view_workflows.py
      - name: Verify ROS1 nested payloads and query adapters
        if: matrix.target == 'js'
        run: python tools/ros1_workflows.py
      - name: Verify bounded temporal joins against brute force matching
        if: matrix.target == 'js'
        run: python tools/temporal_join_workflows.py
      - name: Verify recording session interruption and idempotent recovery
        if: matrix.target == 'js'
        run: python tools/recording_session_workflows.py
      - name: Verify quality events context capture and calibrated clocks
        if: matrix.target == 'js'
        run: python tools/incident_workflows.py
      - name: Verify bounded streaming context clips
        if: matrix.target == 'js'
        run: python tools/stream_clip_workflows.py
      - name: Verify resumable context clip batches
        if: matrix.target == 'js'
        run: python tools/clip_batch_workflows.py
      - name: Verify typed payload encoding and rewrites
        if: matrix.target == 'js'
        run: python tools/payload_rewrite_workflows.py
      - name: Verify schema evolution and normalized views
        if: matrix.target == 'js'
        run: python tools/schema_evolution_workflows.py
      - name: Verify N-topic synchronization and uniform resampling
        if: matrix.target == 'js'
        run: python tools/synchronization_workflows.py
      - name: Verify typed columnar export
        if: matrix.target == 'js'
        run: |
          python -m pip install pyarrow==21.0.0
          python tools/columnar_workflows.py
      - name: Verify offline TF lookup and semantic context
        if: matrix.target == 'js'
        run: python tools/tf_workflows.py
      - name: Verify streaming reads beyond interactive pagination
        if: matrix.target == 'js'
        run: python tools/pull_limit_workflows.py
      - name: Verify incremental queries and live quality snapshots
        if: matrix.target == 'js'
        run: python tools/live_workflows.py
      - name: Verify current Foxglove SDK and device recording
        if: matrix.target == 'js'
        run: |
          python -m pip install foxglove-sdk==0.30.3 websockets==15.0.1
          python tools/device_workflows.py
      - name: Verify tolerant experiment regression and evidence clips
        if: matrix.target == 'js'
        run: python tools/regression_workflows.py
      - name: Verify reproducible recipes and publication crash recovery
        if: matrix.target == 'js'
        run: python tools/recipe_workflows.py
      - name: Verify real codec workers order cancellation budgets and faults
        if: matrix.target == 'js'
        run: python tools/worker_workflows.py
      - name: Measure codec worker overhead and process RSS
        if: matrix.target == 'js'
        run: python tools/worker_benchmark.py
      - name: Verify persistent HTTP pages concurrency faults and crash recovery
        if: matrix.target == 'js'
        run: python tools/cached_http_workflows.py
      - name: Verify byte IO bridges bounded read ahead and measurements
        if: matrix.target == 'js'
        run: python tools/io_workflows.py
      - name: Verify durable merge checkpoints after process termination
        if: matrix.target == 'js'
        run: python tools/checkpoint_workflows.py
      - name: Verify combined Chunk and final merge checkpoint recovery
        if: matrix.target == 'js'
        run: python tools/chunk_pipeline_workflows.py
      - name: Verify JSON predicates precision and projection
        if: matrix.target == 'js'
        run: python tools/json_workflows.py
      - name: Verify fixed-seed differential cases
        if: matrix.target == 'js'
        run: python tools/fuzz_workflows.py
      - name: Verify bounded source diagnostics and recovery evidence
        if: matrix.target == 'js'
        run: python tools/source_diagnostic_workflows.py
      - name: Verify scaled source diagnostics with process RSS
        if: matrix.target == 'js'
        run: python tools/large_source_workflows.py
      - name: Measure process RSS and payload counters
        if: matrix.target == 'js'
        run: python tools/memory_benchmark.py
      - name: Audit package file allowlist
        if: matrix.target == 'js'
        run: python tools/package_audit.py
      - name: Upload interoperability report
        if: matrix.target == 'js'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            _interop/conformance/report.json
            _interop/corpus/report.json
            _interop/examples/report.json
            _interop/range/report.json
            _interop/stream/report.json
            _interop/cli/report.json
            _interop/batch/report.json
            _interop/repair/report.json
            _interop/async/report.json
            _interop/http/report.json
            _interop/external/report.json
            _interop/blocks/report.json
            _interop/transform-stream/report.json
            _interop/dataset/report.json
            _interop/sidecar/report.json
            _interop/disk-index/report.json
            _interop/disk-index-scale/report.json
            _interop/json/report.json
            _interop/checkpoint/report.json
            _interop/input-checkpoint/report.json
            _interop/chunk-checkpoint/report.json
            _interop/chunk-pipeline/report.json
            _interop/io/report.json
            _interop/aggregate/report.json
            _interop/aggregate-external/report.json
            _interop/protobuf/report.json
            _interop/protojson/report.json
            _interop/cdr/report.json
            _interop/async-paged/report.json
            _interop/field-index/report.json
            _interop/workers/report.json
            _interop/worker-benchmark/report.json
            _interop/cached-http/report.json
            _interop/diff/report.json
            _interop/replay/report.json
            _interop/async-dataset/report.json
            _interop/fuzz/report.json
            _interop/source-diagnostics/report.json
            _interop/large-source/report.json
            _interop/memory/report.json
            _interop/package/report.json
            _interop/runtime/report.json
            _interop/pipeline/report.json
            _interop/paged-fields/report.json
            _interop/payload-views/report.json
            _interop/ros1/report.json
            _interop/temporal-join/report.json
            _interop/recording-sessions/report.json
            _interop/incidents/report.json
            _interop/stream-clips/report.json
            _interop/clip-batches/report.json
            _interop/payload-rewrite/report.json
            _interop/schema-evolution/report.json
            _interop/synchronization/report.json
            _interop/columnar/report.json
            _interop/tf/report.json
            _interop/pull-limits/report.json
            _interop/live/report.json
            _interop/device/report.json
            _interop/regression/report.json
            _interop/recipes/report.json
  current-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install current official toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: python tools/runtime_audit.py
      - run: moon check --target js
      - run: moon build --target js
      - run: moon test --target js
      - run: moon doc
  large-source:
    if: github.event_name == 'workflow_dispatch' && inputs.large_source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested toolchain and reference codecs
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python -m pip install mcap==1.3.0 lz4==4.4.5 zstandard==0.25.0
      - run: moon update
      - run: python tools/large_source_workflows.py --large
      - run: python tools/disk_index_scale.py --million
      - uses: actions/upload-artifact@v4
        with:
          name: large-source-report
          path: |
            _interop/large-source/report-large.json
            _interop/disk-index-scale/report-million.json
  public-corpus:
    if: github.event_name == 'workflow_dispatch' && inputs.public_corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested toolchain and reference codecs
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python -m pip install mcap==1.3.0 lz4==4.4.5 zstandard==0.25.0
      - run: moon update
      - run: python -m pip install rosbags==0.11.0
      - run: python tools/corpus_workflows.py --public
      - run: python tools/cdr_workflows.py --public
      - run: python tools/ros1_workflows.py --public
      - run: python tools/incident_workflows.py --public
      - uses: actions/upload-artifact@v4
        with:
          name: public-corpus-report
          path: |
            _interop/corpus/report-public.json
            _interop/incidents/report-public.json
